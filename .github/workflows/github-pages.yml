name: Deploy RenoMetric to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build GitHub Pages artifact
        env:
          RENOMETRIC_BASE: /tangxuejia
          RENOMETRIC_ORIGIN: https://renometric.pages.dev
        run: python3 .github/scripts/build-pages.py

      - name: Run SEO quality checks
        run: python3 .github/scripts/seo-qc.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  live-indexing-smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check robots.txt and sitemap.xml as Googlebot
        env:
          LIVE_ORIGIN: https://renometric.pages.dev
        run: |
          set -euo pipefail
          for agent in \
            "Googlebot/2.1 (+http://www.google.com/bot.html)" \
            "Google-InspectionTool" \
            "Mozilla/5.0"; do
            echo "Testing user-agent: $agent"
            curl --fail --silent --show-error --location \
              --user-agent "$agent" \
              --dump-header /tmp/headers.txt \
              "$LIVE_ORIGIN/robots.txt" > /tmp/robots.txt
            grep -Fq "Sitemap: $LIVE_ORIGIN/sitemap.xml" /tmp/robots.txt
            grep -Eiq "^HTTP/.* 200" /tmp/headers.txt
            curl --fail --silent --show-error --location \
              --user-agent "$agent" \
              --dump-header /tmp/headers.txt \
              "$LIVE_ORIGIN/sitemap.xml" > /tmp/sitemap.xml
            grep -Eiq "^HTTP/.* 200" /tmp/headers.txt
            grep -Eiq "^content-type:.*(xml|text)" /tmp/headers.txt
            python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          origin = os.environ["LIVE_ORIGIN"]
          sitemap = Path("/tmp/sitemap.xml").read_text(encoding="utf-8")
          root = ET.fromstring(sitemap)
          urls = [
              node.text.strip()
              for node in root.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc")
              if node.text and node.text.strip()
          ]
          if root.tag != "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset":
              raise SystemExit("sitemap root is not urlset")
          if len(urls) < 200:
              raise SystemExit(f"sitemap unexpectedly contains only {len(urls)} URLs")
          if any(url != origin and not url.startswith(origin + "/") for url in urls):
              raise SystemExit("sitemap contains a non-official origin")
          print(f"Parsed {len(urls)} URLs; content-type headers:")
          print(Path("/tmp/headers.txt").read_text(encoding="utf-8"))
            PY
          done
