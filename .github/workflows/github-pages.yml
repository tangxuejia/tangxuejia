name: Deploy RenoMetric to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build GitHub Pages artifact
        env:
          RENOMETRIC_BASE: /tangxuejia
          RENOMETRIC_ORIGIN: https://renometric.pages.dev
        run: python3 .github/scripts/build-pages.py

      - name: Run SEO quality checks
        run: python3 .github/scripts/seo-qc.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  live-indexing-smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check robots.txt and sitemap.xml as Googlebot
        env:
          LIVE_ORIGIN: https://renometric.pages.dev
        run: |
          set -euo pipefail
          index=0
          for agent in \
            "Googlebot/2.1 (+http://www.google.com/bot.html)" \
            "Google-InspectionTool" \
            "Mozilla/5.0"; do
            index=$((index + 1))
            echo "Testing user-agent: $agent"
            curl --fail --silent --show-error --location \
              --user-agent "$agent" \
              --dump-header "/tmp/headers-\${index}.txt" \
              "$LIVE_ORIGIN/robots.txt" > "/tmp/robots-\${index}.txt"
            grep -Fq "Sitemap: $LIVE_ORIGIN/sitemap.xml" "/tmp/robots-\${index}.txt"
            grep -Eiq "^HTTP/.* 200" "/tmp/headers-\${index}.txt"
            curl --fail --silent --show-error --location \
              --user-agent "$agent" \
              --dump-header "/tmp/sitemap-headers-\${index}.txt" \
              "$LIVE_ORIGIN/sitemap.xml" > "/tmp/sitemap-\${index}.xml"
            grep -Eiq "^HTTP/.* 200" "/tmp/sitemap-headers-\${index}.txt"
            grep -Eiq "^content-type:.*(xml|text)" "/tmp/sitemap-headers-\${index}.txt"
          done

          python3 -c 'import os, xml.etree.ElementTree as ET; from pathlib import Path; origin=os.environ["LIVE_ORIGIN"]; ns="{http://www.sitemaps.org/schemas/sitemap/0.9}"; path=Path("/tmp/sitemap-1.xml"); root=ET.parse(path).getroot(); urls=[node.text.strip() for node in root.findall(f"{ns}url/{ns}loc") if node.text and node.text.strip()]; assert root.tag == ns + "urlset", "sitemap root is not urlset"; assert len(urls) >= 200, f"sitemap unexpectedly contains only {len(urls)} URLs"; assert all(url == origin or url.startswith(origin + "/") for url in urls), "sitemap contains a non-official origin"; print(f"Parsed {len(urls)} URLs for all three user-agents")'
          cat /tmp/sitemap-headers-1.txt
