<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electricity Cost Calculator | RenoMetric</title><meta name="description" content="Estimate appliance electricity cost from watts, hours, days and electricity rate."><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.6;color:#17231f}label{display:block;margin:12px 0}input{padding:10px;width:100%;box-sizing:border-box;margin-top:5px}button{padding:11px 18px;background:#1f6b52;color:white;border:0;border-radius:6px}#r{margin-top:20px;padding:16px;background:#e8f3ed;border-radius:8px}</style></head><body><p><a href="../">← RenoMetric</a></p><h1>Electricity Cost Calculator</h1><p>Estimate an appliance's energy use and cost from its wattage and operating schedule.</p><label>Power (W)<input id="w" type="number" value="1000" min="0" step="any"></label><label>Hours per day<input id="h" type="number" value="4" min="0" step="any"></label><label>Days per month<input id="d" type="number" value="30" min="0" step="any"></label><label>Electricity rate ($/kWh)<input id="p" type="number" value="0.15" min="0" step="any"></label><button onclick="calc()">Calculate energy cost</button><div id="r"></div><h2>Formula</h2><p>kWh = watts × hours ÷ 1,000. Cost = kWh × electricity rate.</p><p><b>Planning note:</b> Actual bills can include taxes, demand charges, tiers, minimums and changing rates.</p><script>function calc(){const w=+document.getElementById('w').value,h=+document.getElementById('h').value,d=+document.getElementById('d').value,p=+document.getElementById('p').value;if(!(w>=0&&h>=0&&d>=0&&p>=0)){r.innerHTML='Check the inputs.';return}const k=w*h*d/1000;document.getElementById('r').innerHTML='<b>Monthly energy:</b> '+k.toFixed(1)+' kWh<br><b>Estimated monthly cost:</b> $'+(k*p).toFixed(2); }calc()</script></body></html>
