<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMU Mortar Calculator</title><meta name="description" content="Estimate mortar quantity for concrete masonry block walls."><style>body{font-family:Arial,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.6}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 14px}button{padding:11px 18px}#r{margin-top:20px;padding:16px;background:#f3f3f3}</style></head><body><h1>CMU Mortar Calculator</h1><p>Preliminary estimate of mortar volume for a CMU wall.</p><label>Wall area (ft²)<input id="a" type="number" value="200" step="any"></label><label>Mortar allowance (ft³ per 100 ft²)<input id="m" type="number" value="3" step="any"></label><label>Waste (%)<input id="w" type="number" value="10" step="any"></label><button onclick="calc()">Calculate</button><div id="r"></div><p>Mortar consumption varies with block size, joint thickness, workmanship and grout details. Use supplier data for ordering.</p><script>function calc(){let a=+document.getElementById('a').value,m=+document.getElementById('m').value,w=+document.getElementById('w').value;if(a<=0||m<=0||w<0){r.innerHTML='Enter valid values.';return}let v=a/100*m*(1+w/100);document.getElementById('r').innerHTML='<b>Estimated mortar: '+v.toFixed(2)+' ft³</b><br>With waste: '+w+'%';}</script></body></html>
