<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topsoil Calculator | Cubic Yards & Tons</title><meta name="description" content="Calculate topsoil volume in cubic yards and estimate weight using an adjustable bulk density."><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:1.6}.card{border:1px solid #ddd;border-radius:12px;padding:20px;margin:18px 0}label{display:block;margin:10px 0}input{padding:10px;max-width:280px;width:100%}button{padding:12px 20px}.result{font-size:1.15rem}</style></head><body><h1>Topsoil Calculator</h1><p>Estimate topsoil volume for lawns, raised beds and grading work.</p><div class="card"><label>Length (ft)<input id="l" type="number" value="30"></label><label>Width (ft)<input id="w" type="number" value="20"></label><label>Depth (in)<input id="d" type="number" value="4"></label><label>Waste/settling (%)<input id="x" type="number" value="10"></label><label>Bulk density (lb/yd³)<input id="rho" type="number" value="2000"></label><button onclick="c()">Calculate</button></div><div class="card result" id="r">Enter dimensions and calculate.</div><div class="card"><p>Volume in cubic yards = length × width × depth ÷ 324. Weight is an estimate only because soil density varies with moisture, compaction and material source.</p></div><script>function c(){let l=+document.getElementById('l').value,w=+document.getElementById('w').value,d=+document.getElementById('d').value,x=+document.getElementById('x').value,rho=+document.getElementById('rho').value,v=l*w*d/324,o=v*(1+x/100),lb=o*rho;document.getElementById('r').innerHTML=`<b>Base volume:</b> ${v.toFixed(2)} yd³<br><b>Order volume:</b> ${o.toFixed(2)} yd³<br><b>Estimated weight:</b> ${(lb/2000).toFixed(2)} short tons (${Math.round(lb).toLocaleString()} lb)`}</script></body></html>
