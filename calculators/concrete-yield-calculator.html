<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concrete Yield Calculator</title><meta name="description" content="Calculate concrete yield from batch component volumes."><style>body{font-family:Arial,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.6}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 14px}button{padding:11px 18px}#r{margin-top:20px;padding:16px;background:#f3f3f3}</style></head><body><h1>Concrete Yield Calculator</h1><p>Estimate the combined absolute volume of cement, water and aggregates entered for a batch.</p><label>Cement volume (ft³)<input id="c" type="number" value="1" step="any"></label><label>Water volume (ft³)<input id="w" type="number" value="2" step="any"></label><label>Aggregate volume (ft³)<input id="a" type="number" value="8" step="any"></label><button onclick="calc()">Calculate</button><div id="r"></div><p>True concrete yield should be determined from batch weights and absolute volumes using the applicable mix-design method. This simple tool is for preliminary checks only.</p><script>function calc(){let c=+document.getElementById('c').value,w=+document.getElementById('w').value,a=+document.getElementById('a').value;if(c<0||w<0||a<0){r.innerHTML='Enter valid values.';return}let v=c+w+a;document.getElementById('r').innerHTML='<b>Estimated combined volume: '+v.toFixed(2)+' ft³</b><br>Equivalent: '+(v/27).toFixed(3)+' yd³';}</script></body></html>
